<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
body{font-family:system-ui,sans-serif;width:240px;margin:0;padding:12px;background:#0f172a;color:#e2e8f0;font-size:13px}
h3{margin:0 0 10px;font-size:14px}
button{display:block;width:100%;margin-bottom:8px;padding:9px;border-radius:9px;border:0;background:#6366f1;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
button.ghost{background:transparent;border:1px solid #ef4444;color:#f87171}
button:hover{filter:brightness(1.1)}
p{font-size:11px;opacity:.6;line-height:1.5;margin:8px 0 0}
</style>
</head>
<body>
<h3>\u229E Zendo Groups</h3>
<button id="open">Открыть панель групп</button>
<button id="all" class="ghost">Разгруппировать всё</button>
<p>Панель также открывается круглой кнопкой \u229E справа на странице доски.</p>
<script src="popup.js"></script>
</body>
</html>
